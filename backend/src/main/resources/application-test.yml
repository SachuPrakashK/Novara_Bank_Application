spring:
  security:
    oauth2:
      client:
        registration:
          novara:
            client-secret: test-only-client-secret
      resourceserver:
        jwt:
          issuer-uri: http://issuer.test
novara:
  security:
    audience: novara-api
    csrf-cookie-secure: false
  beneficiaries:
    hash-key: test-only-beneficiary-hash-key-32-chars-minimum
    cooling-period: 24h
