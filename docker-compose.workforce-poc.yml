name: novara-workforce-poc

services:
  workforce-keycloak:
    image: quay.io/keycloak/keycloak:26.0.8
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${WORKFORCE_KEYCLOAK_ADMIN:?Inject a disposable admin username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${WORKFORCE_KEYCLOAK_ADMIN_PASSWORD:?Inject a disposable admin password}
      NOVARA_WORKFORCE_POC_CLIENT_SECRET: ${NOVARA_WORKFORCE_POC_CLIENT_SECRET:?Inject the browser-client secret}
      NOVARA_WORKFORCE_VERIFIER_SECRET: ${NOVARA_WORKFORCE_VERIFIER_SECRET:?Inject the verifier-client secret}
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./keycloak/novara-workforce-test-realm.json:/opt/keycloak/data/import/novara-workforce-test-realm.json:ro
    tmpfs:
      - /opt/keycloak/data
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/novara-workforce-test/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3\""]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
